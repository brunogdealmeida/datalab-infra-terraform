name: datalab
version: "1.0.0"
config-version: 2

profile: default

model-paths: ["models"]
seed-paths:  ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  datalab:
    raw:
      +schema: raw
      +materialized: table
    staging:
      +schema: staging
      +materialized: view
    mart:
      +schema: mart
      +materialized: table
