name: Terraform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev, staging, prod)"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      action:
        description: "Terraform action"
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || (github.ref == 'refs/heads/main' && 'apply' || 'plan') }}
    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
      ACTION: ${{ github.event.inputs.action || (github.ref == 'refs/heads/main' && 'apply' || 'plan') }}
      REGION: us-central1
      REPOSITORY_ID: datalab-images
      DBT_IMAGE_NAME: dbt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.TERRAFORM_SA_EMAIL }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push dbt image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY_ID }}/${{ env.DBT_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY_ID }}/${{ env.DBT_IMAGE_NAME }}:latest \
            ./dbt

          docker push ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY_ID }}/${{ env.DBT_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY_ID }}/${{ env.DBT_IMAGE_NAME }}:latest

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        run: make ENV=${{ env.ENV }} init

      - name: Terraform Plan
        id: plan
        run: make ENV=${{ env.ENV }} plan
        continue-on-error: ${{ env.ACTION != 'plan' }}

      - name: Terraform Apply
        if: env.ACTION == 'apply'
        run: make ENV=${{ env.ENV }} apply

      - name: Terraform Destroy
        if: env.ACTION == 'destroy'
        run: make ENV=${{ env.ENV }} destroy